database:
  path: /opt/agent-memory/agent.db

server:
  host: 0.0.0.0
  port: 18088
  recall_timeout_seconds: 1.8

qdrant:
  enabled: true
  url: http://127.0.0.1:6333
  collection: agent_chunks_qwen3_4b
  timeout_seconds: 0.5
  vector_size: 2560

embedding:
  provider: none
  local_model: Qwen/Qwen3-Embedding-4B
  http_url: http://127.0.0.1:18089
  query_prefix: "Instruct: Given a user request to recall durable agent-memory facts and documentation, retrieve relevant memories and document chunks.\nQuery: "
  document_prefix: ""
  openai_model: text-embedding-3-small
  openai_api_key_env: OPENAI_API_KEY
  allow_during_recall: false
  timeout_seconds: 0.8

vector_cache:
  enabled: true
  path: ../tmep/agent-memory-vector-cache
  max_attempts: 3

ingest:
  docs_path: /opt/agent-memory/docs
  chunk_chars: 1200
  chunk_overlap: 160
  supported_extensions:
    - .md
    - .txt
    - .log
    - .json
    - .yaml
    - .yml
    - .csv

recall:
  fts_limit: 20
  vector_limit: 20
  default_limit_memories: 5
  default_limit_docs: 3
