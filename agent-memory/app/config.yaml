database:
  path: /opt/agent-memory/agent.db

server:
  host: 0.0.0.0
  port: 18088
  recall_timeout_seconds: 1.8

qdrant:
  enabled: true
  url: http://127.0.0.1:6333
  collection: agent_chunks_bge_m3_hybrid
  timeout_seconds: 3.0
  vector_size: 1024
  hybrid: true
  dense_vector_name: dense
  sparse_vector_name: sparse

embedding:
  provider: http
  local_model: /models/bge-m3
  http_url: http://127.0.0.1:18090
  query_prefix: ""
  document_prefix: ""
  openai_model: text-embedding-3-small
  openai_api_key_env: OPENAI_API_KEY
  allow_during_recall: true
  timeout_seconds: 2.5

reranker:
  enabled: true
  provider: http
  local_model: /models/bge-reranker-v2-m3
  http_url: http://100.114.74.111:18091
  timeout_seconds: 20.0
  candidate_limit: 12
  min_score: 0.5

vector_profiles:
  default: bge_m3
  profiles:
    bge_m3:
      qdrant:
        collection: agent_chunks_bge_m3_hybrid
        vector_size: 1024
        hybrid: true
        dense_vector_name: dense
        sparse_vector_name: sparse
      embedding:
        provider: http
        local_model: /models/bge-m3
        http_url: http://127.0.0.1:18090
        query_prefix: ""
        document_prefix: ""
        allow_during_recall: true
        timeout_seconds: 2.5

vector_cache:
  enabled: true
  path: ../tmep/agent-memory-vector-cache
  targets:
    - bge_m3
  profiles:
    bge_m3:
      path: ../tmep/agent-memory-vector-cache/bge_m3
  max_attempts: 3

ingest:
  docs_path: /opt/agent-memory/docs
  chunk_chars: 1200
  chunk_overlap: 160
  supported_extensions:
    - .md
    - .txt
    - .log
    - .json
    - .yaml
    - .yml
    - .csv

recall:
  fts_limit: 20
  vector_limit: 20
  default_limit_memories: 5
  default_limit_docs: 3
